<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מחולל תכנית למידה אגפית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@800&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* Entry gate: one centered card, the 12-month strip from the wizard as the only ornament. */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#141a29; --muted:#556079; --line:#d6dce6; --line-strong:#b6c0d0;
  --accent:#28398a; --accent-hover:#1e2c6f; --on-accent:#ffffff; --sunken:#e8ecf2; --focus:#4f6bff; --danger:#b42318;
  --c1:#3d63c9; --c2:#b9770e; --c3:#7a4fc4; --c4:#1f8a7e; --c5:#c9476b;
  --font-display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --font-body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e121a; --surface:#161b26; --ink:#e6e9f1; --muted:#9aa3b8; --line:#2a3242; --line-strong:#3c4659;
    --accent:#a6b4ff; --accent-hover:#bfcaff; --on-accent:#111633; --sunken:#11161f; --focus:#8da0ff; --danger:#ff8a80;
    --c1:#7e9cf2; --c2:#e2a64d; --c3:#aa8bec; --c4:#4fc1b2; --c5:#ee839e;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  display:grid;grid-template-columns:minmax(0,420px);justify-content:center;align-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.gate{min-width:0;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:4px}
.kicker{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,7vw,32px);line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.strip span{height:8px;border-radius:2px;background:var(--sunken)}
.strip span:nth-child(1),.strip span:nth-child(2){background:var(--c2)}
.strip span:nth-child(3){background:var(--c1)}
.strip span:nth-child(5),.strip span:nth-child(9){background:var(--c3)}
.strip span:nth-child(6),.strip span:nth-child(7){background:var(--c4)}
.strip span:nth-child(11),.strip span:nth-child(12){background:var(--c5)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:13.5px;font-weight:600}
.pw-wrap{display:flex;gap:6px}
input[type=password],input[type=text]{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.ghost{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
.btn{min-height:44px;border:0;border-radius:7px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{opacity:.6;cursor:progress}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.err{margin:0;color:var(--danger);font-size:13.5px;font-weight:600}
.note{margin:0;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
body.checking .card{visibility:hidden}
</style>
</head>
<body>
<main class="gate">
  <div class="brand">
    <span class="kicker">נבחרת AI Champions · הטמעת AI בארגון</span>
    <h1>מחולל <em>תכנית למידה</em> אגפית</h1>
    <div class="strip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <form class="card" id="gate-form" novalidate>
    <label class="lbl" for="pw">סיסמת כניסה</label>
    <div class="pw-wrap">
      <input id="pw" type="password" autocomplete="current-password" dir="ltr" spellcheck="false" required>
      <button class="ghost" type="button" id="show" aria-pressed="false" aria-controls="pw">הצגה</button>
    </div>
    <label class="check"><input type="checkbox" id="remember"> לזכור אותי במחשב הזה</label>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" id="go" type="submit">כניסה</button>
  </form>
  <p class="note">הכלי מיועד לנבחרת ה-AI Champions בארגון.</p>
  <noscript><p class="err">כדי להיכנס צריך לאפשר JavaScript בדפדפן.</p></noscript>
</main>

  var KEY_STORE='ai-plan-wizard:gate:'+location.pathname;
  var form=document.getElementById('gate-form'), pw=document.getElementById('pw'), go=document.getElementById('go'),
      err=document.getElementById('err'), rem=document.getElementById('remember'), show=document.getElementById('show');
  function b64(s){ var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function toB64(buf){ var u=new Uint8Array(buf), s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function fail(msg){ err.textContent=msg; err.hidden=false; go.disabled=false; go.textContent='כניסה'; document.body.classList.remove('checking'); }
  var subtle=window.crypto&&window.crypto.subtle;
  if(!P||!subtle){ fail('הדפדפן הזה לא יכול לפתוח את הכלי. נסו דפדפן עדכני (Chrome, Edge, Safari או Firefox).'); go.disabled=true; return; }
  var salt=b64(P.s), iv=b64(P.i), ct=b64(P.c);
  function enter(html){ document.open(); document.write(html); document.close(); }
  function decryptWith(key){ return subtle.decrypt({name:'AES-GCM',iv:iv},key,ct).then(function(b){ return new TextDecoder().decode(b); }); }
  function derive(pass){
    return subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(base){
      return subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']); });
  }
  function getStored(){ try{ var s=JSON.parse(localStorage.getItem(KEY_STORE)||'null'); return s&&s.s===P.s?s.k:null; }catch(e){ return null; } }
  function forget(){ try{ localStorage.removeItem(KEY_STORE); }catch(e){} }

  // Returning visitor who chose "remember me"
  var stored=getStored();
  if(stored){
    document.body.classList.add('checking');
    subtle.importKey('raw',b64(stored),'AES-GCM',false,['decrypt']).then(decryptWith).then(enter)
      .catch(function(){ forget(); document.body.classList.remove('checking'); pw.focus(); });
  } else { pw.focus(); }

  show.addEventListener('click',function(){ var on=pw.type==='password'; pw.type=on?'text':'password'; show.textContent=on?'הסתרה':'הצגה'; show.setAttribute('aria-pressed',String(on)); pw.focus(); });
  pw.addEventListener('input',function(){ err.hidden=true; });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var pass=pw.value; if(!pass){ fail('יש להזין סיסמה.'); pw.focus(); return; }
    err.hidden=true; go.disabled=true; go.textContent='בודק…';
    var keyRef;
    derive(pass).then(function(key){ keyRef=key; return decryptWith(key); }).then(function(html){
      if(rem.checked){ return subtle.exportKey('raw',keyRef).then(function(raw){ try{ localStorage.setItem(KEY_STORE,JSON.stringify({s:P.s,k:toB64(raw)})); }catch(x){} return html; }); }
      forget(); return html;
    }).then(enter).catch(function(){ fail('הסיסמה שגויה. נסו שוב.'); pw.select(); });
  });
